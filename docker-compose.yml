services:
  db:
    image: postgres:15
    container_name: flame_track_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: flame_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
volumes:
  db_data: